name: Deploy to Google Cloud Run

on:
  push:
    branches: [ "main" ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: "us-central1"
  GCR_HOSTNAME: "gcr.io"

jobs:
  test:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install and run backend tests
        run: |
          pip install -r backend/requirements.txt
          pytest backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and run frontend tests
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test -- --watchAll=false

  build-and-push:
    name: "Build and Push Docker Images"
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v1'

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCR_HOSTNAME }}

      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/todo-app-backend:${{ github.sha }} ./backend
          docker push ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/todo-app-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/todo-app-frontend:${{ github.sha }} ./frontend
          docker push ${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/todo-app-frontend:${{ github.sha }}

  deploy:
    name: "Deploy to Google Cloud Run"
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.2.0

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Apply
        run: |
          terraform -chdir=terraform apply -auto-approve \
            -var="gcp_project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="backend_image=${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/todo-app-backend:${{ github.sha }}" \
            -var="frontend_image=${{ env.GCR_HOSTNAME }}/${{ env.GCP_PROJECT_ID }}/todo-app-frontend:${{ github.sha }}"
